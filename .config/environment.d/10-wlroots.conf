# card0 je NVIDIA, card1 Intel - a cisla cardN nejsou stabilni napric bootem,
# proto stabilni cesta z /dev/dri/by-path/.
#
# Kompozitor tim drzime na Intelu, ktery jako jediny ma pripojene konektory
# (eDP-1, HDMI-A-1, DP-1..4). NVIDIA zustava na render offload a CUDA.
#
# Promennou cte jen wlroots, takze Plasma session tim neni nijak dotcena.
WLR_DRM_DEVICES=/dev/dri/by-path/pci-0000:00:02.0-card
